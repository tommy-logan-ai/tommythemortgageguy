<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALTEAM Coming Soon — Off-Market Listings</title>
<meta property="og:title" content="REALTEAM Coming Soon — Off-Market Listings">
<meta property="og:description" content="Off-market homes coming soon from REALTEAM Real Estate. Be first.">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7fa;color:#222}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}

<body><div class="wrap"><h1>🏡 Coming Soon — Off-Market Listings</h1>
<p style="color:#666">REALTEAM homes hitting the market soon. See one you like? Open it and request a tour.</p>
<div class="grid"><div style="color:#888;grid-column:1/-1;text-align:center;padding:2rem">No off-market listings right now — check back soon.</div></div>
<div style="text-align:center;color:#aaa;font-size:.8rem;margin-top:2rem">REALTEAM Real Estate · Financing by Tommy The Mortgage Guy</div>
</div><!-- TTMG page-view beacon (codified 2026-06-09, ISA ttmg-blog-pageview-beacon).
     Fires once per tab-session on load; posts to the /api/pv edge function which
     inserts a page_view row server-side. No key in the browser, non-blocking. -->
<script>
  window.addEventListener('load', function () {
    try {
      var k = 'ttmg_pv_' + location.pathname;
      if (sessionStorage.getItem(k)) return;
      sessionStorage.setItem(k, '1');
      var u = new URL(location.href);
      fetch('/api/pv', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          page_path: location.pathname,
          referrer: document.referrer || null,
          utm_source: u.searchParams.get('utm_source'),
          utm_medium: u.searchParams.get('utm_medium'),
          utm_campaign: u.searchParams.get('utm_campaign'),
          utm_term: u.searchParams.get('utm_term'),
          utm_content: u.searchParams.get('utm_content')
        })
      });
    } catch (e) { /* swallow — never error the page */ }
  });
</script>
</body></html>
